# Explicitly define our internal network
networks:
  smarthome_net:
    driver: bridge

services:
  # ----------------------------------------
  # 1. System API & Frontend Gateway
  # ----------------------------------------
  gateway:
    build:
      context: . 
      dockerfile: ./services/gateway/Dockerfile
    container_name: home_gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - smarthome_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./certs:/app/certs:ro
    command: >
      uv run uvicorn main:app 
      --host 0.0.0.0 
      --port 8000 
      --ssl-keyfile=/app/certs/awapc.tail1752d3.ts.net.key
      --ssl-certfile=/app/certs/awapc.tail1752d3.ts.net.crt

  # ----------------------------------------
  # 2. LLM Agent Logic
  # ----------------------------------------
  agent:
    build:
      context: .
      dockerfile: ./services/agent/Dockerfile
    container_name: home_agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    networks:
      - smarthome_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G # Prevent LLM processing from starving the gateway
    depends_on:
      gateway:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ----------------------------------------
  # 3. Short-term Memory (Digital Twin)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: home_redis
    restart: unless-stopped
    volumes:
      - ./volumes/redis_data:/data
    networks:
      - smarthome_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------
  # 4. Long-term Memory
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: home_postgres
    restart: unless-stopped
    # Using defaults prevents compose from crashing if the .env is missing during a quick boot
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: home_os
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - smarthome_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d home_os"]
      interval: 10s
      timeout: 5s
      retries: 5